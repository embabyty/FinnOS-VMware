name: ISO image

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  iso:
    name: build the FinnOS install ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tool that writes the image
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso
      - name: build the ISO
        run: vm/build-iso.sh finnos.iso
      - name: upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: finnos-iso
          path: finnos.iso