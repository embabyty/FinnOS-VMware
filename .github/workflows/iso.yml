name: ISO image

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  iso:
    name: build and boot the FinnOS install ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tools that write the image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools qemu-system-x86
      - name: the Arch Linux base
        run: |
          mkdir -p .cache
          curl -fsSLo .cache/archlinux-x86_64.iso \
            https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso
          curl -fsSLo sha256sums.txt \
            https://geo.mirror.pkgbuild.com/iso/latest/sha256sums.txt
          (cd .cache && grep 'archlinux-x86_64.iso' ../sha256sums.txt | sha256sum -c -)
      - name: build the ISO
        # Root so the file capabilities in the live root survive the
        # repack; the disc itself stays readable by the runner.
        run: |
          sudo vm/build-iso.sh finnos.iso
          sudo chown "$(id -u):$(id -g)" finnos.iso
      - name: the disc is bootable
        run: |
          xorriso -indev finnos.iso -report_el_torito plain
      - name: the payload is in the live root
        run: |
          xorriso -osirrox on -indev finnos.iso \
            -extract /arch/x86_64/airootfs.sfs /tmp/airootfs.sfs
          rm -rf /tmp/live
          unsquashfs -q -d /tmp/live /tmp/airootfs.sfs \
            opt/finnos/vm/finn-install.sh \
            opt/finnos/vm/finn-chroot.sh \
            usr/local/bin/finn-install \
            root/.zprofile root/.bash_profile
          # The installer is run, not read, so the mode is part of it.
          test -x /tmp/live/opt/finnos/vm/finn-install.sh
          test -x /tmp/live/opt/finnos/vm/finn-chroot.sh
          test -x /tmp/live/usr/local/bin/finn-install
          # The live shell is what starts the installer, so the hook has to
          # be in the file that shell reads: the live environment's root
          # shell is zsh.
          grep -q 'finn.install' /tmp/live/root/.zprofile
          grep -q 'finn.install' /tmp/live/root/.bash_profile
      - name: the menus say FinnOS
        run: |
          xorriso -osirrox on -indev finnos.iso \
            -extract /boot/syslinux /tmp/syslinux
          grep -rE 'MENU TITLE FinnOS' /tmp/syslinux
          grep -E 'DEFAULT finnos' /tmp/syslinux/archiso_sys-linux.cfg
          grep -E 'MENU LABEL Install FinnOS' /tmp/syslinux/archiso_sys-linux.cfg
          grep -E 'MENU LABEL FinnOS live shell' /tmp/syslinux/archiso_sys-linux.cfg
          ! grep -rE 'Arch Linux' /tmp/syslinux/*.cfg
          xorriso -osirrox on -indev finnos.iso \
            -extract /loader/entries /tmp/entries
          cat /tmp/entries/00-finnos.conf
          grep -E 'title +Install FinnOS' /tmp/entries/00-finnos.conf
          grep -E 'finn\.install' /tmp/entries/00-finnos.conf
          ! grep -rE 'Arch Linux' /tmp/entries
      - name: boot it
        run: vm/test-boot.sh finnos.iso
      - name: look at the menu
        run: vm/menu-shot.sh finnos.iso /tmp/menu
      - name: the menu frames
        uses: actions/upload-artifact@v4
        with:
          name: boot-menu
          path: |
            /tmp/menu/frame-*.png
            /tmp/menu/frame-*.ppm
          if-no-files-found: warn
      - name: upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: finnos-iso
          path: finnos.iso